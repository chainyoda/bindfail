[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bindfail"
version = "0.1.0"
description = "CLI for the bind.fail protein binder design benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
bindfail = "bindfail.cli:cli"

[project.urls]
Homepage = "https://bind.fail"
Repository = "https://github.com/chainyoda/bindfail"

[tool.setuptools.packages.find]
include = ["bindfail*"]
